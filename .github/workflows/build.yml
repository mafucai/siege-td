name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

env:
  GODOT_VERSION: 4.3
  EXPORT_NAME: fortress-td
  PACKAGE_NAME: com.mafucai.fortresstd

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install Android platform & build-tools
        run: |
          sdkmanager --install "platforms;android-33" "platforms;android-34" \
            "build-tools;33.0.2" "build-tools;34.0.0" \
            "platform-tools" "ndk;23.2.8568313"
          yes | sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Download Godot headless
        run: |
          set -euo pipefail
          mkdir -p "$HOME/godot"
          cd "$HOME/godot"
          curl -fL --retry 3 -o godot.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip
          mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" godot
          chmod +x godot
          ./godot --version

      - name: Download export templates
        run: |
          set -euo pipefail
          cd "$HOME/godot"
          curl -fL --retry 3 -o templates.tpz \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          mkdir -p "$HOME/.local/share/godot/export_templates"
          unzip -q templates.tpz -d "$HOME/.local/share/godot/export_templates"
          mv "$HOME/.local/share/godot/export_templates/templates" \
             "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          ls "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable" | head

      - name: Create debug keystore
        run: |
          set -euo pipefail
          keytool -genkeypair -v \
            -keystore debug.keystore \
            -storepass android -keypass android \
            -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Write export presets
        env:
          PACKAGE_NAME: ${{ env.PACKAGE_NAME }}
          KEYSTORE_PATH: ${{ github.workspace }}/debug.keystore
        run: |
          set -euo pipefail
          python3 tools/gen_export_presets.py
          echo "--- 生成结果（关键行）---"
          grep -E 'keystore|package/unique_name|package/signed' export_presets.cfg

      - name: Write editor settings (Java / Android SDK / keystore)
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export JAVA_SDK="${JAVA_HOME}"
          export KEYSTORE_PATH="$PWD/debug.keystore"
          python3 tools/gen_editor_settings.py
          echo "--- 生成的文件 ---"
          cat "$HOME/.config/godot/editor_settings-4.3.tres"
          echo "--- SDK 内容 ---"
          ls "$ANDROID_HOME/platforms" || true
          ls "$ANDROID_HOME/build-tools" || true

      - name: Import project
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          "$HOME/godot/godot" --headless --path . --import || true
          ls -la .godot 2>/dev/null | head

      - name: Export APK
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          mkdir -p build
          "$HOME/godot/godot" --headless --path . --verbose --export-debug "Android" build/fortress-td.apk 2>&1 | tee export.log || true
          echo "=== 导出日志（完整）==="
          cat export.log
          echo "=== build 目录 ==="
          ls -la build/ || true
          test -f build/fortress-td.apk || { echo "=== 导出日志 ==="; cat export.log; exit 1; }
          ls -la build/

      - name: Sign APK
        run: |
          set -euo pipefail
          SDK_BT="${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools/34.0.0"
          "${SDK_BT}/zipalign" -p -f 4 build/fortress-td.apk build/aligned.apk
          "${SDK_BT}/apksigner" sign \
            --ks debug.keystore --ks-pass pass:android --key-pass pass:android \
            --ks-key-alias androiddebugkey \
            --out build/fortress-td-signed.apk build/aligned.apk
          "${SDK_BT}/apksigner" verify build/fortress-td-signed.apk
          "${SDK_BT}/aapt" dump badging build/fortress-td-signed.apk | head -3

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: fortress-td-apk
          path: build/fortress-td-signed.apk
          retention-days: 30

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-logs
          path: |
            export.log
            .godot/
          retention-days: 7
