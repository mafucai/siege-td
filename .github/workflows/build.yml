name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

env:
  GODOT_VERSION: 4.3
  EXPORT_NAME: fortress-td
  PACKAGE_NAME: com.mafucai.fortresstd

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install Android platform & build-tools
        run: |
          sdkmanager --install "platforms;android-34" "build-tools;34.0.0" "ndk;23.2.8568313"
          yes | sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Download Godot headless
        run: |
          set -euo pipefail
          mkdir -p "$HOME/godot"
          cd "$HOME/godot"
          curl -fL --retry 3 -o godot.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip
          mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" godot
          chmod +x godot
          ./godot --version

      - name: Download export templates
        run: |
          set -euo pipefail
          cd "$HOME/godot"
          curl -fL --retry 3 -o templates.tpz \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          mkdir -p "$HOME/.local/share/godot/export_templates"
          unzip -q templates.tpz -d "$HOME/.local/share/godot/export_templates"
          mv "$HOME/.local/share/godot/export_templates/templates" \
             "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          ls "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable" | head

      - name: Create debug keystore
        run: |
          set -euo pipefail
          keytool -genkeypair -v \
            -keystore debug.keystore \
            -storepass android -keypass android \
            -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Write export presets
        run: |
          set -euo pipefail
          cat > export_presets.cfg <<'PRESET'
          [preset.0]

          name="Android"
          platform="Android"
          runnable=true
          advanced_options=false
          dedicated_server=false
          custom_features=""
          export_filter="all_resources"
          include_filter=""
          exclude_filter=""
          export_path="build/fortress-td.apk"
          pathex=""
          encryption_include_filters=""
          encryption_exclude_filters=""
          seed=0
          encrypt_pck=false
          encrypt_directory=false

          [preset.0.options]

          custom_template/debug=""
          custom_template/release=""
          gradle_build/use_gradle_build=false
          gradle_build/gradle_build_directory=""
          gradle_build/android_source_template=""
          gradle_build/compress_native_libraries=false
          gradle_build/export_format=0
          gradle_build/min_sdk=""
          gradle_build/target_sdk=""
          architectures/armeabi-v7a=true
          architectures/arm64-v8a=true
          architectures/x86=false
          architectures/x86_64=false
          version/code=1
          version/name="1.0"
          package/unique_name="PACKAGE_NAME_PLACEHOLDER"
          package/name="堡垒塔防"
          package/signed=true
          package/app_category=2
          package/retain_data_on_uninstall=false
          package/exclude_from_recents=false
          package/show_in_android_tv=false
          package/show_in_app_library=true
          package/show_as_launcher_app=false
          launcher_icons/main_192x192=""
          launcher_icons/adaptive_foreground_432x432=""
          launcher_icons/adaptive_background_432x432=""
          graphics/opengl_debug=false
          xr_features/xr_mode=0
          screen/immersive_mode=true
          screen/support_small=true
          screen/support_normal=true
          screen/support_large=true
          screen/support_xlarge=true
          user_data_backup/allow=false
          command_line/extra_args=""
          apk_expansion/enable=false
          apk_expansion/SALT=""
          apk_expansion/public_key=""
          permissions/custom_permissions=PackedStringArray()
          PRESET
          sed -i "s|PACKAGE_NAME_PLACEHOLDER|${PACKAGE_NAME}|" export_presets.cfg
          # 去掉 heredoc 每行前的缩进
          sed -i 's/^          //' export_presets.cfg
          head -20 export_presets.cfg

      - name: Write editor settings (Java / Android SDK / keystore)
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
        run: |
          set -euo pipefail
          : "${ANDROID_HOME:=/usr/local/lib/android/sdk}"
          export ANDROID_HOME
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls -d "$ANDROID_HOME" || { echo "SDK 目录不存在"; exit 1; }
          mkdir -p "$HOME/.config/godot"
          JAVA_HOME_REAL="$(dirname "$(dirname "$(readlink -f "$(command -v javac)")")")"
          echo "JAVA_HOME_REAL=$JAVA_HOME_REAL"
          cat > "$HOME/.config/godot/editor_settings-4.3.tres" <<TRES
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/java_sdk_path = "${JAVA_HOME_REAL}"
          export/android/android_sdk_path = "${ANDROID_HOME}"
          export/android/debug_keystore = "$PWD/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          export/android/force_system_user = false
          export/android/shutdown_adb_on_exit = true
          TRES
          sed -i 's/^          //' "$HOME/.config/godot/editor_settings-4.3.tres"
          cat "$HOME/.config/godot/editor_settings-4.3.tres"

      - name: Import project
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          "$HOME/godot/godot" --headless --path . --import || true
          ls -la .godot 2>/dev/null | head

      - name: Export APK
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          mkdir -p build
          "$HOME/godot/godot" --headless --path . --export-debug "Android" build/fortress-td.apk 2>&1 | tee export.log || true
          echo "=== 导出日志（完整）==="
          cat export.log
          echo "=== build 目录 ==="
          ls -la build/ || true
          test -f build/fortress-td.apk || { echo "=== 导出日志 ==="; cat export.log; exit 1; }
          ls -la build/

      - name: Sign APK
        run: |
          set -euo pipefail
          SDK_BT="${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools/34.0.0"
          "${SDK_BT}/zipalign" -p -f 4 build/fortress-td.apk build/aligned.apk
          "${SDK_BT}/apksigner" sign \
            --ks debug.keystore --ks-pass pass:android --key-pass pass:android \
            --ks-key-alias androiddebugkey \
            --out build/fortress-td-signed.apk build/aligned.apk
          "${SDK_BT}/apksigner" verify build/fortress-td-signed.apk
          "${SDK_BT}/aapt" dump badging build/fortress-td-signed.apk | head -3

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: fortress-td-apk
          path: build/fortress-td-signed.apk
          retention-days: 30

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-logs
          path: |
            export.log
            .godot/
          retention-days: 7
